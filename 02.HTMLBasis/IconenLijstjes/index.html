<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IconenLijstjes</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <h1>Versie met UTF-8</h1>
    <ul>
        <li>&#x2709; <a href="">email</a></li>
        <li>&#9742; <a href="">telefoon</a></li>
        <li>&#128439; <a href="">fax</a></li>
    </ul>

    <h1>Versie met emoji's</h1>
    <p>raad de film:</p>
    <ul>
        <li>🐔🏃</li>
        <li>⏰🍊</li>
        <li>🔍🐟</li>
        <li>💩🕺</li>
    </ul>

    <h1>Versie met Material icons</h1>
    <ul>
        <li><span class="material-symbols-outlined">account_circle</span><a href="">account</a></li>
        <li><span class="material-symbols-outlined">settings</span><a href="">instellingen</a></li>
        <li><span class="material-symbols-outlined">help</span><a href="">help</a></li>
    </ul>

    <h1>Versie met FontAwesome</h1>
    <ul>
        <li><span class="fa-brands fa-facebook"></span> <a href="">visit me</a></li>
        <li><span class="fa-brands fa-youtube"></span> <a href="">watch me</a></li>
        <li><span class="fa-brands fa-square-instagram"></span> <a href="">follow me</a></li>
        <li><span class="fa-brands fa-square-x-twitter"></span> <a href="">X me</a></li>
    </ul>

</body>

</html>
