<body>

    <header>
        <h1><a href="index.html">Ol' Toy Bench</a></h1>
        <p>a second life for timeless toys</p>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>

            </ul>
        </nav>

    <main>
        <section>
            <h2>Contact us</h2>

            <!--formulier voor contact-->
            <form>

                <label for="name">Name:</label><br>
                <label><input id="name" type="text" placeholder="e.g. John Doe" required></label>
                <br>
                <label for="mail">Email</label><br>
                <label><input id="mail" type="email" placeholder="e.g. johndoe@sky.net" required></label>
                <br>
                <label for="tel">Phone</label><br>
                <label><input id="tel" type="tel" placeholder="e.g. +32" required></label>
                <br>
                <label for="message">Message</label><br>
                <textarea id="message" required></textarea>

                <button type="submit">Submit</button>
            </form>
        </section>

        <div>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d96873.72404095989!2d-73.94483555000001!3d40.64523145!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c24416947c2109%3A0x82765c7404007886!2sBrooklyn%2C%20New%20York%2C%20Verenigde%20Staten!5e0!3m2!1snl!2sbe!4v1772529517599!5m2!1snl!2sbe"
                width="600" height="450" allowfullscreen="" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>

        <div>
            <address>
                <span class="material-symbols-outlined">
                    location_on
                </span>
                Address: <br>
                1224 Park PI, Brooklyn, NY 11213 <br>
                <span class="material-symbols-outlined">
                    call
                </span>
                Phone: <br>
                +1 800 559 6580 <br>
                <span class="material-symbols-outlined">
                    mail
                </span>
                E-mail: <br>
                <a href="mailto:">mail@demolink.org</a>
            </address>
        </div>
    </main>
